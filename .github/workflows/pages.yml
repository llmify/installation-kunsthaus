# Publishes the visitor site to GitHub Pages.
#
# Only site/dist/ is uploaded — never the repository root. Everything here is
# public by design, but keeping the artifact pinned to one built directory means
# a future addition to this repo cannot end up served by accident.
#
# Requires Settings -> Pages -> Source = "GitHub Actions" to be selected once.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a running one, so a half-published site
# never sits in front of visitors.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the site
        run: node site/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
